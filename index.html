<!DOCTYPE html>
<body>

  <div class="calculator">

    <div class="left">
      <h1>Tip Calculator</h1>

      <div class="form-group">
        <label for="billAmount">Bill Amount (Rs)</label>
        <input type="number" id="billAmount" placeholder="Enter bill amount">
        <small class="error" id="billError"></small>
      </div>

      <div class="form-group">
        <label>Select Tip %</label>

        <div class="tip-buttons">
          <button class="tip-btn" data-tip="10">10%</button>
          <button class="tip-btn" data-tip="15">15%</button>
          <button class="tip-btn" data-tip="20">20%</button>
        </div>

        <input type="number" id="customTip" placeholder="Custom Tip %">
        <small class="error" id="tipError"></small>
      </div>

      <div class="form-group">
        <label for="people">Number of People</label>
        <input type="number" id="people" placeholder="Enter number of people">
        <small class="error" id="peopleError"></small>
      </div>
    </div>

    <div class="right">
      <div class="result-box">
        <h3>Tip Amount</h3>
        <p id="tipAmount">Rs 0.00</p>
      </div>

      <div class="result-box">
        <h3>Grand Total</h3>
        <p id="grandTotal">Rs 0.00</p>
      </div>

      <div class="result-box">
        <h3>Per Person</h3>
        <p id="perPerson">Rs 0.00</p>
      </div>

      <button id="resetBtn">Reset</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
